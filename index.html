  /* ─ Profil ─ */
  function Profil({user,onLogout,nav,nbNotifs=0,nbItems=0}){
    const [profil,setProfil]   = useState(null);
    const [loading,setLoading] = useState(true);
    const [edit,setEdit]       = useState(false);
    const [form,setForm]       = useState({nom:'',prenom:'',mot_de_passe:''});
    const [msg,setMsg]         = useState('');
    const [busy,setBusy]       = useState(false);
    useEffect(()=>{
      api('profil.php').then(d=>{ setProfil(d.user); setForm({nom:d.user.nom,prenom:d.user.prenom,mot_de_passe:''}); })
        .finally(()=>setLoading(false));
    },[]);
    async function sauvegarder(e){
      e.preventDefault(); setBusy(true); setMsg('');
      try{
        await api('profil.php',{method:'POST',body:JSON.stringify(form)});
        setMsg('✓ Profil mis à jour !'); setEdit(false);
        const d=await api('profil.php'); setProfil(d.user);
      }catch(err){setMsg(err.message);}finally{setBusy(false);}
    }
    if(loading)return <div className="screen-center muted">Chargement…</div>;
    const roleLabel={voyageur:'Voyageur',hote:'Hôte',admin:'Administrateur'};
    return (
      <div className="page">
        <Topbar user={user} onLogout={onLogout} nav={nav} nbNotifs={nbNotifs} nbItems={nbItems}/>
        <div className="detail-header">
          <button className="btn-back" onClick={()=>nav('catalogue')}>← Retour</button>
          <h1 className="detail-title">Mon profil</h1>
        </div>
        {msg&&<p className={msg.startsWith('✓')?'msg-ok':'error'} style={{marginBottom:'1rem'}}>{msg}</p>}
        {!edit ? (
          <div className="card" style={{maxWidth:'480px',padding:'2rem'}}>
            <div className="profil-row"><span className="muted small">Prénom</span><strong>{profil.prenom}</strong></div>
            <div className="profil-row"><span className="muted small">Nom</span><strong>{profil.nom}</strong></div>
            <div className="profil-row"><span className="muted small">Email</span><strong>{profil.email}</strong></div>
            <div className="profil-row"><span className="muted small">Rôle</span><span className="tag">{roleLabel[profil.role]||profil.role}</span></div>
            <div className="profil-row"><span className="muted small">Statut</span><span className={`tag${profil.statut==='actif'?'':' tag-warn'}`}>{profil.statut}</span></div>
            <div className="profil-row"><span className="muted small">Membre depuis</span><strong>{fmtDate(profil.date_inscription)}</strong></div>
            <button className="btn" style={{marginTop:'1.5rem'}} onClick={()=>setEdit(true)}>Modifier mon profil</button>
          </div>
        ) : (
          <form onSubmit={sauvegarder} className="form card" style={{maxWidth:'480px',padding:'2rem'}}>
            <div className="form-row">
              <label className="field"><span>Prénom</span><input value={form.prenom} onChange={e=>setForm(f=>({...f,prenom:e.target.value}))} required/></label>
              <label className="field"><span>Nom</span><input value={form.nom} onChange={e=>setForm(f=>({...f,nom:e.target.value}))} required/></label>
            </div>
            <label className="field"><span>Nouveau mot de passe (laisser vide pour ne pas changer)</span>
              <input type="password" value={form.mot_de_passe} onChange={e=>setForm(f=>({...f,mot_de_passe:e.target.value}))} minLength={8} autoComplete="new-password"/>
            </label>
            <div className="booking-actions">
              <button type="submit" className="btn" disabled={busy}>{busy?'Sauvegarde…':'Sauvegarder'}</button>
              <button type="button" className="btn-ghost" onClick={()=>setEdit(false)}>Annuler</button>
            </div>
          </form>
        )}
      </div>
    );
  }

  /* ─ Notifications ─ */
  function Notifications({user,onLogout,nav,nbNotifs=0,nbItems=0}){
    const [notifs,setNotifs]   = useState([]);
    const [loading,setLoading] = useState(true);
    useEffect(()=>{ api('notifications.php').then(d=>setNotifs(d.notifications)).finally(()=>setLoading(false)); },[]);
    async function toutLu(){ await api('notifications.php',{method:'POST'}); setNotifs(notifs.map(n=>({...n,lu:1}))); }
    const icons={reservation_confirmee:'✓',depart_proche:'✈',modification:'📝',activite_a_venir:'⭐',systeme:'ℹ'};
    return (
      <div className="page">
        <Topbar user={user} onLogout={onLogout} nav={nav} nbNotifs={nbNotifs} nbItems={nbItems}/>
        <div className="detail-header">
          <button className="btn-back" onClick={()=>nav('catalogue')}>← Retour</button>
          <h1 className="detail-title">Notifications</h1>
        </div>
        {!loading&&notifs.some(n=>!n.lu)&&<button className="btn-ghost" style={{marginBottom:'1rem'}} onClick={toutLu}>Tout marquer comme lu</button>}
        {loading&&<p className="muted">Chargement…</p>}
        {!loading&&notifs.length===0&&<p className="muted">Aucune notification.</p>}
        {notifs.map(n=>(
          <div key={n.id_notification} className={`notif-item${n.lu==1?' lu':''}`}>
            <span className="notif-icon">{icons[n.type]||'ℹ'}</span>
            <div><strong>{n.titre}</strong><p className="muted small">{n.message}</p><p className="muted small">{fmtDatetime(n.date_creation)}</p></div>
            {n.lu==0&&<span className="notif-dot"></span>}
          </div>
        ))}
      </div>
    );
  }

  /* ─ Espace hôte ─ */
  function HoteDashboard({user,onLogout,nav,nbNotifs=0,nbItems=0}){
    const [data,setData]         = useState(null);
    const [destinations,setDests] = useState([]);
    const [loading,setLoading]   = useState(true);
    const [msg,setMsg]   = useState('');
    const [busy,setBusy] = useState(false);
    const [confirmModal,setConfirmModal] = useState(null);
    const [showHebForm,setShowHebForm] = useState(false);
    const [showActForm,setShowActForm] = useState(false);
    const [showDispoFor,setShowDispoFor] = useState(null);
    const defHeb={nom:'',type:'appartement',capacite:2,prix_semaine:500,duree_min_nuits:7,id_destination:''};
    const defAct={nom:'',description:'',categorie:'aventure',prix_personne:50,duree_h:2,niveau:'facile',id_destination:'',date_heure:'',places_totales:8};
    const defDispo={date_debut:'',date_fin:''};
    const [formHeb,setFormHeb]   = useState(defHeb);
    const [formAct,setFormAct]   = useState(defAct);
    const [formDispo,setFormDispo] = useState(defDispo);
    async function reload(){
      const [d,dests]=await Promise.all([api('hote_dashboard.php'),api('destinations.php')]);
      setData(d); setDests(dests.destinations);
      const id=String(dests.destinations[0]?.id_destination??'');
      setFormHeb(f=>({...f,id_destination:id})); setFormAct(f=>({...f,id_destination:id}));
    }
    useEffect(()=>{ reload().finally(()=>setLoading(false)); },[]);
    async function submitHeb(e){
      e.preventDefault(); setBusy(true); setMsg('');
      try{
        await api('hote_creer_hebergement.php',{method:'POST',body:JSON.stringify({...formHeb,capacite:parseInt(formHeb.capacite),prix_semaine:parseFloat(formHeb.prix_semaine),duree_min_nuits:parseInt(formHeb.duree_min_nuits),id_destination:parseInt(formHeb.id_destination)})});
        setMsg('✓ Hébergement publié !'); setShowHebForm(false); setFormHeb(defHeb); await reload();
      }catch(err){setMsg(err.message);}finally{setBusy(false);}
    }
    async function submitAct(e){
      e.preventDefault(); setBusy(true); setMsg('');
      try{
        await api('hote_creer_activite.php',{method:'POST',body:JSON.stringify({...formAct,prix_personne:parseFloat(formAct.prix_personne),duree_h:parseFloat(formAct.duree_h),places_totales:parseInt(formAct.places_totales),id_destination:parseInt(formAct.id_destination)})});
        setMsg('✓ Activité publiée !'); setShowActForm(false); setFormAct(defAct); await reload();
      }catch(err){setMsg(err.message);}finally{setBusy(false);}
    }
    async function submitDispo(e){
      e.preventDefault(); setBusy(true); setMsg('');
      try{
        await api('hote_creer_dispo.php',{method:'POST',body:JSON.stringify({id_hebergement:showDispoFor,...formDispo})});
        setMsg('✓ Disponibilité ajoutée !'); setShowDispoFor(null); setFormDispo(defDispo); await reload();
      }catch(err){setMsg(err.message);}finally{setBusy(false);}
    }
    const sel=setter=>e=>setter(f=>({...f,[e.target.name]:e.target.value}));
    if(loading)return <div className="screen-center muted">Chargement…</div>;
    return (
      <div className="page">
        {confirmModal&&<ConfirmModal msg={confirmModal.msg} onOk={()=>{confirmModal.fn();setConfirmModal(null);}} onCancel={()=>setConfirmModal(null)}/>}
        <Topbar user={user} onLogout={onLogout} nav={nav} nbNotifs={nbNotifs} nbItems={nbItems}/>
        <div className="detail-header">
          <h1 className="detail-title">Espace hôte</h1>
          <p className="muted">Gérez vos hébergements et vos expériences locales.</p>
        </div>
        {msg&&<p className={msg.startsWith('✓')?'msg-ok':'error'} style={{marginBottom:'1rem'}}>{msg}</p>}
        <section className="detail-section">
          <div className="section-hd">
            <h2 className="section-title" style={{border:'none',marginBottom:0}}>Mes hébergements</h2>
            <button className="btn" onClick={()=>{setShowHebForm(!showHebForm);setShowActForm(false);}}>{showHebForm?'Annuler':'+ Ajouter'}</button>
          </div>
          {showHebForm&&(
            <form onSubmit={submitHeb} className="dash-form">
              <div className="form-row">
                <label className="field"><span>Nom</span><input name="nom" value={formHeb.nom} onChange={sel(setFormHeb)} required/></label>
                <label className="field"><span>Type</span><select name="type" value={formHeb.type} onChange={sel(setFormHeb)}>{['appartement','maison','villa','chambre','autre'].map(t=><option key={t}>{t}</option>)}</select></label>
              </div>
              <div className="form-row">
                <label className="field"><span>Capacité</span><input type="number" name="capacite" min="1" value={formHeb.capacite} onChange={sel(setFormHeb)} required/></label>
                <label className="field"><span>Prix/sem (€)</span><input type="number" name="prix_semaine" min="1" step="0.01" value={formHeb.prix_semaine} onChange={sel(setFormHeb)} required/></label>
                <label className="field"><span>Durée min (nuits)</span><input type="number" name="duree_min_nuits" min="1" value={formHeb.duree_min_nuits} onChange={sel(setFormHeb)} required/></label>
              </div>
              <label className="field"><span>Destination</span><select name="id_destination" value={formHeb.id_destination} onChange={sel(setFormHeb)}>{destinations.map(d=><option key={d.id_destination} value={d.id_destination}>{d.nom} ({d.pays})</option>)}</select></label>
              <button type="submit" className="btn" disabled={busy}>{busy?'Publication…':'Publier'}</button>
            </form>
          )}
          {(data?.hebergements??[]).length===0&&!showHebForm&&<p className="muted">Aucun hébergement publié.</p>}
          {(data?.hebergements??[]).map(h=>(
            <div key={h.id_hebergement} className="dash-item">
              <div><strong>{h.nom}</strong> <span className="tag">{h.type}</span> <span className="tag">{h.destination}</span>
                <p className="muted small">{h.capacite} pers. · {h.prix_semaine} €/sem · {h.nb_dispos} dispo(s)</p>
              </div>
              <div style={{display:'flex',gap:'.5rem'}}>
                <button className="btn-ghost" onClick={()=>{setShowDispoFor(h.id_hebergement);setMsg('');}}>+ Dispo</button>
                <button className="btn-danger-sm" disabled={busy} onClick={()=>setConfirmModal({msg:'Supprimer cet hébergement ?', fn:async()=>{
                  setBusy(true);setMsg('');
                  try{await api('hote_supprimer_hebergement.php',{method:'POST',body:JSON.stringify({id:h.id_hebergement})});await reload();}
                  catch(err){setMsg(err.message);}finally{setBusy(false);}
                }})}>Supprimer</button>
              </div>
            </div>
          ))}
          {showDispoFor&&(
            <form onSubmit={submitDispo} className="dash-form" style={{marginTop:'.5rem'}}>
              <p className="booking-label">Nouvelle disponibilité</p>
              <div className="form-row">
                <label className="field"><span>Date début</span><input type="date" name="date_debut" value={formDispo.date_debut} onChange={sel(setFormDispo)} required/></label>
                <label className="field"><span>Date fin</span><input type="date" name="date_fin" value={formDispo.date_fin} onChange={sel(setFormDispo)} required/></label>
              </div>
              <div className="booking-actions">
                <button type="submit" className="btn" disabled={busy}>{busy?'…':'Ajouter'}</button>
                <button type="button" className="btn-ghost" onClick={()=>setShowDispoFor(null)}>Annuler</button>
              </div>
            </form>
          )}
        </section>
        <section className="detail-section">
          <div className="section-hd">
            <h2 className="section-title" style={{border:'none',marginBottom:0}}>Mes activités</h2>
            <button className="btn" onClick={()=>{setShowActForm(!showActForm);setShowHebForm(false);}}>{showActForm?'Annuler':'+ Ajouter'}</button>
          </div>
          {showActForm&&(
            <form onSubmit={submitAct} className="dash-form">
              <div className="form-row">
                <label className="field"><span>Nom</span><input name="nom" value={formAct.nom} onChange={sel(setFormAct)} required/></label>
                <label className="field"><span>Catégorie</span><select name="categorie" value={formAct.categorie} onChange={sel(setFormAct)}>{['aventure','culture','nature','gastronomie','bien_etre'].map(c=><option key={c}>{c}</option>)}</select></label>
                <label className="field"><span>Niveau</span><select name="niveau" value={formAct.niveau} onChange={sel(setFormAct)}>{['facile','moyen','difficile'].map(n=><option key={n}>{n}</option>)}</select></label>
              </div>
              <label className="field"><span>Description</span><input name="description" value={formAct.description} onChange={sel(setFormAct)}/></label>
              <div className="form-row">
                <label className="field"><span>Prix/pers (€)</span><input type="number" name="prix_personne" min="1" step="0.01" value={formAct.prix_personne} onChange={sel(setFormAct)} required/></label>
                <label className="field"><span>Durée (h)</span><input type="number" name="duree_h" min=".5" step=".5" value={formAct.duree_h} onChange={sel(setFormAct)}/></label>
                <label className="field"><span>Places</span><input type="number" name="places_totales" min="1" value={formAct.places_totales} onChange={sel(setFormAct)} required/></label>
              </div>
              <div className="form-row">
                <label className="field"><span>Premier créneau</span><input type="datetime-local" name="date_heure" value={formAct.date_heure} onChange={sel(setFormAct)} required/></label>
                <label className="field"><span>Destination</span><select name="id_destination" value={formAct.id_destination} onChange={sel(setFormAct)}>{destinations.map(d=><option key={d.id_destination} value={d.id_destination}>{d.nom} ({d.pays})</option>)}</select></label>
              </div>
              <button type="submit" className="btn" disabled={busy}>{busy?'Publication…':'Publier'}</button>
            </form>
          )}
          {(data?.activites??[]).length===0&&!showActForm&&<p className="muted">Aucune activité publiée.</p>}
          {(data?.activites??[]).map(a=>(
            <div key={a.id_activite} className="dash-item">
              <div><strong>{a.nom}</strong> <span className="tag">{a.categorie}</span> <span className="tag">{a.destination}</span>
                <p className="muted small">{a.prix_personne} €/pers. · {a.nb_creneaux} créneau(x) dispo.</p>
              </div>
              <button className="btn-danger-sm" disabled={busy} onClick={()=>setConfirmModal({msg:'Supprimer cette activité ?', fn:async()=>{
                setBusy(true);setMsg('');
                try{await api('hote_supprimer_activite.php',{method:'POST',body:JSON.stringify({id:a.id_activite})});await reload();}
                catch(err){setMsg(err.message);}finally{setBusy(false);}
              }})}>Supprimer</button>
            </div>
          ))}
        </section>
      </div>
    );
  }

  /* ─ Espace admin ─ */
  function AdminDashboard({user,onLogout,nav,nbNotifs=0,nbItems=0}){
    const [data,setData]     = useState(null);
    const [loading,setLoading] = useState(true);
    const [msg,setMsg]   = useState('');
    const [busy,setBusy] = useState(false);
    const [confirmModal,setConfirmModal] = useState(null);
    const [showForm,setShowForm]   = useState(false);
    const [showTrForm,setShowTrForm] = useState(false);
    const defDest={nom:'',pays:'',region:'',description:'',latitude:'',longitude:''};
    const defTr={id_destination:'',ville_depart:'',type:'avion',compagnie:'',date_depart:'',date_arrivee:'',prix:'',places_dispo:''};
    const [form,setForm]   = useState(defDest);
    const [formTr,setFormTr] = useState(defTr);
    async function reload(){ const d=await api('admin_dashboard.php'); setData(d); }
    useEffect(()=>{ reload().finally(()=>setLoading(false)); },[]);
    async function submitDest(e){
      e.preventDefault(); setBusy(true); setMsg('');
      try{
        await api('admin_creer_destination.php',{method:'POST',body:JSON.stringify({...form,latitude:form.latitude?parseFloat(form.latitude):null,longitude:form.longitude?parseFloat(form.longitude):null})});
        setMsg('✓ Destination publiée !'); setShowForm(false); setForm(defDest); await reload();
      }catch(err){setMsg(err.message);}finally{setBusy(false);}
    }
    async function submitTr(e){
      e.preventDefault(); setBusy(true); setMsg('');
      try{
        await api('admin_creer_transport.php',{method:'POST',body:JSON.stringify({...formTr,id_destination:parseInt(formTr.id_destination),prix:parseFloat(formTr.prix),places_dispo:parseInt(formTr.places_dispo)})});
        setMsg('✓ Transport créé !'); setShowTrForm(false); setFormTr(defTr); await reload();
      }catch(err){setMsg(err.message);}finally{setBusy(false);}
    }
    const sel  = e=>setForm(f=>({...f,[e.target.name]:e.target.value}));
    const selTr= e=>setFormTr(f=>({...f,[e.target.name]:e.target.value}));
    if(loading)return <div className="screen-center muted">Chargement…</div>;
    const s=data?.stats??{};
    return (
      <div className="page">
        {confirmModal&&<ConfirmModal msg={confirmModal.msg} onOk={()=>{confirmModal.fn();setConfirmModal(null);}} onCancel={()=>setConfirmModal(null)}/>}
        <Topbar user={user} onLogout={onLogout} nav={nav} nbNotifs={nbNotifs} nbItems={nbItems}/>
        <div className="detail-header">
          <h1 className="detail-title">Espace admin</h1>
          <p className="muted">Gérez les destinations et modérez les contenus.</p>
        </div>
        {msg&&<p className={msg.startsWith('✓')?'msg-ok':'error'} style={{marginBottom:'1rem'}}>{msg}</p>}
        <div className="stats-row">
          {[['Utilisateurs',s.nb_utilisateurs],['Voyageurs',s.nb_voyageurs],['Hôtes',s.nb_hotes],['Destinations',s.nb_destinations],['Hébergements',s.nb_hebergements],['Séjours validés',s.nb_sejours_valides]].map(([l,v])=>(
            <div key={l} className="stat-card"><span className="stat-val">{v}</span><span className="muted small">{l}</span></div>
          ))}
        </div>
        <section className="detail-section">
          <div className="section-hd">
            <h2 className="section-title" style={{border:'none',marginBottom:0}}>Destinations</h2>
            <button className="btn" onClick={()=>setShowForm(!showForm)}>{showForm?'Annuler':'+ Nouvelle destination'}</button>
          </div>
          {showForm&&(
            <form onSubmit={submitDest} className="dash-form">
              <div className="form-row">
                <label className="field"><span>Nom</span><input name="nom" value={form.nom} onChange={sel} required/></label>
                <label className="field"><span>Pays</span><input name="pays" value={form.pays} onChange={sel} required/></label>
                <label className="field"><span>Région</span><input name="region" value={form.region} onChange={sel}/></label>
              </div>
              <label className="field"><span>Description</span><input name="description" value={form.description} onChange={sel}/></label>
              <div className="form-row">
                <label className="field"><span>Latitude</span><input type="number" name="latitude" step=".000001" value={form.latitude} onChange={sel}/></label>
                <label className="field"><span>Longitude</span><input type="number" name="longitude" step=".000001" value={form.longitude} onChange={sel}/></label>
              </div>
              <button type="submit" className="btn" disabled={busy}>{busy?'Publication…':'Publier la destination'}</button>
            </form>
          )}
          {(data?.destinations??[]).map(d=>(
            <div key={d.id_destination} className="dash-item">
              <div><strong>{d.nom}</strong> <span className="tag">{d.pays}</span>
                {d.region&&<span className="muted small" style={{marginLeft:'.5rem'}}>{d.region}</span>}
                <p className="muted small">{d.nb_hebergements} hébergement(s)</p>
              </div>
              <button className="btn-danger-sm" disabled={busy} onClick={()=>setConfirmModal({msg:`Supprimer la destination "${d.nom}" ?`, fn:async()=>{
                setBusy(true);setMsg('');
                try{await api('admin_supprimer_destination.php',{method:'POST',body:JSON.stringify({id:d.id_destination})});await reload();}
                catch(err){setMsg(err.message);}finally{setBusy(false);}
              }})}>Supprimer</button>
            </div>
          ))}
        </section>
        <section className="detail-section">
          <div className="section-hd">
            <h2 className="section-title" style={{border:'none',marginBottom:0}}>Transports</h2>
            <button className="btn" onClick={()=>setShowTrForm(!showTrForm)}>{showTrForm?'Annuler':'+ Nouveau transport'}</button>
          </div>
          {showTrForm&&(
            <form onSubmit={submitTr} className="dash-form">
              <div className="form-row">
                <label className="field"><span>Destination</span>
                  <select name="id_destination" value={formTr.id_destination} onChange={selTr} required>
                    <option value="">— choisir —</option>
                    {(data?.destinations??[]).map(d=><option key={d.id_destination} value={d.id_destination}>{d.nom} ({d.pays})</option>)}
                  </select>
                </label>
                <label className="field"><span>Ville de départ</span><input name="ville_depart" value={formTr.ville_depart} onChange={selTr} required/></label>
                <label className="field"><span>Type</span>
                  <select name="type" value={formTr.type} onChange={selTr}>{['avion','train','bus','ferry'].map(t=><option key={t}>{t}</option>)}</select>
                </label>
              </div>
              <div className="form-row">
                <label className="field"><span>Compagnie</span><input name="compagnie" value={formTr.compagnie} onChange={selTr}/></label>
                <label className="field"><span>Prix (€)</span><input type="number" name="prix" min="0" step="0.01" value={formTr.prix} onChange={selTr} required/></label>
                <label className="field"><span>Places</span><input type="number" name="places_dispo" min="1" value={formTr.places_dispo} onChange={selTr} required/></label>
              </div>
              <div className="form-row">
                <label className="field"><span>Date de départ</span><input type="datetime-local" name="date_depart" value={formTr.date_depart} onChange={selTr} required/></label>
                <label className="field"><span>Date d'arrivée</span><input type="datetime-local" name="date_arrivee" value={formTr.date_arrivee} onChange={selTr} required/></label>
              </div>
              <button type="submit" className="btn" disabled={busy}>{busy?'Création…':'Créer le transport'}</button>
            </form>
          )}
        </section>
        <section className="detail-section">
          <h2 className="section-title">Séjours et voyageurs associés</h2>
          {(data?.sejours??[]).map(s=>(
            <div key={s.id_sejour} className="dash-item">
              <div>
                <strong>{s.titre}</strong>
                <span className="tag" style={{marginLeft:'.5rem'}}>{s.statut}</span>
                <p className="muted small">Voyageur : {s.voyageur_prenom} {s.voyageur_nom} — {s.voyageur_email}</p>
                {s.date_debut&&<p className="muted small">{fmtDate(s.date_debut)} → {fmtDate(s.date_fin)} · {Number(s.prix_total).toFixed(2)} €</p>}
              </div>
              {s.statut==='brouillon'&&(
                <button className="btn-danger-sm" disabled={busy} onClick={()=>setConfirmModal({msg:`Supprimer le séjour "${s.titre}" ?`, fn:async()=>{
                  setBusy(true);setMsg('');
                  try{await api('supprimer_sejour.php',{method:'POST'});await reload();}
                  catch(err){setMsg(err.message);}finally{setBusy(false);}
                }})}>Supprimer</button>
              )}
            </div>
          ))}
        </section>
        <section className="detail-section">
          <h2 className="section-title">Gestion des utilisateurs</h2>
          {(data?.utilisateurs??[]).map(u=>(
            <div key={u.id_utilisateur} className="dash-item">
              <div>
                <strong>{u.prenom} {u.nom}</strong>
                <span className="tag" style={{marginLeft:'.5rem'}}>{u.role}</span>
                {u.statut==='suspendu'&&<span className="tag tag-warn" style={{marginLeft:'.4rem'}}>suspendu</span>}
                <p className="muted small">{u.email}</p>
              </div>
              <div style={{display:'flex',gap:'.4rem',flexWrap:'wrap'}}>
                {u.role!=='admin'    && <button className="btn-ghost" style={{fontSize:'.75rem',padding:'.2rem .6rem'}} disabled={busy} onClick={async()=>{setBusy(true);try{await api('admin_gerer_utilisateur.php',{method:'POST',body:JSON.stringify({id:u.id_utilisateur,action:'promote_admin'})});await reload();}catch(err){setMsg(err.message);}finally{setBusy(false);}}}>→ Admin</button>}
                {u.role!=='hote'     && <button className="btn-ghost" style={{fontSize:'.75rem',padding:'.2rem .6rem'}} disabled={busy} onClick={async()=>{setBusy(true);try{await api('admin_gerer_utilisateur.php',{method:'POST',body:JSON.stringify({id:u.id_utilisateur,action:'promote_hote'})});await reload();}catch(err){setMsg(err.message);}finally{setBusy(false);}}}>→ Hôte</button>}
                {u.role!=='voyageur' && <button className="btn-ghost" style={{fontSize:'.75rem',padding:'.2rem .6rem'}} disabled={busy} onClick={async()=>{setBusy(true);try{await api('admin_gerer_utilisateur.php',{method:'POST',body:JSON.stringify({id:u.id_utilisateur,action:'demote'})});await reload();}catch(err){setMsg(err.message);}finally{setBusy(false);}}}>→ Voyageur</button>}
                {u.statut==='actif'
                  ? <button className="btn-danger-sm" disabled={busy} onClick={async()=>{setBusy(true);try{await api('admin_gerer_utilisateur.php',{method:'POST',body:JSON.stringify({id:u.id_utilisateur,action:'suspend'})});await reload();}catch(err){setMsg(err.message);}finally{setBusy(false);}}}>Suspendre</button>
                  : <button className="btn-ghost"    disabled={busy} onClick={async()=>{setBusy(true);try{await api('admin_gerer_utilisateur.php',{method:'POST',body:JSON.stringify({id:u.id_utilisateur,action:'activer'})});await reload();}catch(err){setMsg(err.message);}finally{setBusy(false);}}}>Réactiver</button>
                }
              </div>
            </div>
          ))}
        </section>
      </div>
    );
  }

  /* ─ Historique des séjours ─ */
  function Historique({user,onLogout,nav,nbNotifs=0,nbItems=0}){
    const [historique,setHistorique] = useState([]);
    const [loading,setLoading]       = useState(true);
    const [avisModal,setAvisModal]   = useState(null);
    const [note,setNote]             = useState(0);
    const [commentaire,setCommentaire] = useState('');
    const [msg,setMsg]   = useState('');
    const [msgOk,setMsgOk] = useState(false);
    const [busy,setBusy] = useState(false);
    const reload = ()=>api('historique.php').then(d=>setHistorique(d.historique||[]));
    useEffect(()=>{ reload().finally(()=>setLoading(false)); },[]);
    async function annulerSejour(id){
      if(!confirm('Annuler ce séjour ? Les disponibilités seront restituées.')) return;
      setBusy(true); setMsg(''); setMsgOk(false);
      try{
        await api('annuler_sejour.php',{method:'POST',body:JSON.stringify({id_sejour:id})});
        setMsg('Séjour annulé.'); setMsgOk(true); await reload();
      }catch(err){setMsg(err.message); setMsgOk(false);}finally{setBusy(false);}
    }
    async function soumettreAvis(e){
      e.preventDefault(); if(!note)return; setBusy(true); setMsg('');
      try{
        await api('avis.php',{method:'POST',body:JSON.stringify({type:avisModal.type,id_cible:avisModal.id_cible,note,commentaire})});
        setMsg('Avis enregistré. Merci !'); setAvisModal(null); setNote(0); setCommentaire('');
      }catch(err){setMsg(err.message);}finally{setBusy(false);}
    }
    if(loading)return <div className="screen-center muted">Chargement…</div>;
    return (
      <div className="page">
        <Topbar user={user} onLogout={onLogout} nav={nav} nbNotifs={nbNotifs} nbItems={nbItems}/>
        <div className="detail-header">
          <button className="btn-back" onClick={()=>nav('catalogue')}>← Retour</button>
          <h1 className="detail-title">Mes voyages</h1>
        </div>
        {msg&&<p className={msgOk?'msg-ok':'error'} style={{marginBottom:'1rem'}}>{msg}</p>}
        {historique.length===0&&<p className="muted">Aucun séjour pour le moment.</p>}
        {historique.map(({sejour,hebergements,activites,transports})=>(
          <section key={sejour.id_sejour} className="detail-section">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'1rem'}}>
              <div>
                <h2 style={{margin:'0 0 .25rem'}}>{sejour.titre}</h2>
                <p className="muted small">{fmtDate(sejour.date_creation)} · {Number(sejour.prix_total).toFixed(2)} €</p>
              </div>
              <div style={{display:'flex',gap:'.75rem',alignItems:'center'}}>
                <span className="tag tag-ok">validé</span>
                <button className="btn-ghost" style={{color:'#c0392b',fontSize:'.82rem',padding:'.3rem .7rem'}} disabled={busy} onClick={()=>annulerSejour(sejour.id_sejour)}>Annuler</button>
              </div>
            </div>
            {(hebergements||[]).map(h=>(
              <div key={h.id_hebergement} className="hist-item">
                <div>
                  <span className="hist-icon">🏠</span>
                  <div><strong>{h.nom_hebergement}</strong> <span className="tag">{h.type}</span>
                    <p className="muted small">{h.nom_destination}, {h.pays}</p>
                    <p className="muted small">{fmtDate(h.date_debut)} → {fmtDate(h.date_fin)} · {Number(h.prix).toFixed(0)} €</p>
                  </div>
                </div>
                <button className="btn-ghost hist-rate-btn" onClick={()=>{setAvisModal({type:'hebergement',id_cible:h.id_hebergement,nom:h.nom_hebergement});setNote(0);setCommentaire('');setMsg('');}}>⭐ Évaluer</button>
              </div>
            ))}
            {(activites||[]).map(a=>(
              <div key={a.id_activite} className="hist-item">
                <div>
                  <span className="hist-icon">🎯</span>
                  <div><strong>{a.nom_activite}</strong> <span className="tag">{a.categorie}</span>
                    <p className="muted small">{a.nom_destination} · {fmtDatetime(a.date_heure)} · {a.nb_participants} pers.</p>
                    <p className="muted small">{Number(a.prix).toFixed(0)} €</p>
                  </div>
                </div>
                <button className="btn-ghost hist-rate-btn" onClick={()=>{setAvisModal({type:'activite',id_cible:a.id_activite,nom:a.nom_activite});setNote(0);setCommentaire('');setMsg('');}}>⭐ Évaluer</button>
              </div>
            ))}
            {(transports||[]).map((t,i)=>(
              <div key={i} className="hist-item">
                <div>
                  <span className="hist-icon">{transportIcon(t.type)}</span>
                  <div><strong>{t.sens==='retour'?`${t.destination} → ${t.ville_depart}`:`${t.ville_depart} → ${t.destination}`}</strong> <span className="tag">{t.type}</span>
                    <p className="muted small">{fmtDatetime(t.date_depart)} · {t.nb_passagers} passager(s) · {Number(t.prix).toFixed(0)} €</p>
                  </div>
                </div>
              </div>
            ))}
          </section>
        ))}
        {avisModal&&(
          <div className="modal-overlay" onClick={()=>setAvisModal(null)}>
            <div className="modal-card" onClick={e=>e.stopPropagation()}>
              <h3 style={{marginBottom:'.5rem'}}>Évaluer</h3>
              <p className="muted" style={{marginBottom:'1rem'}}>{avisModal.nom}</p>
              <form onSubmit={soumettreAvis} className="form">
                <div style={{marginBottom:'1rem'}}><StarRating value={note} onRate={setNote}/></div>
                <label className="field">
                  <span>Commentaire (facultatif)</span>
                  <textarea value={commentaire} onChange={e=>setCommentaire(e.target.value)} rows="3" style={{resize:'vertical'}}/>
                </label>
                {msg&&<p className="error">{msg}</p>}
                <div className="booking-actions">
                  <button type="submit" className="btn" disabled={busy||!note}>{busy?'Envoi…':'Envoyer'}</button>
                  <button type="button" className="btn-ghost" onClick={()=>setAvisModal(null)}>Annuler</button>
                </div>
              </form>
            </div>
          </div>
        )}
      </div>
    );
  }

  /* ─ Application ─ */
  if(localStorage.getItem('darkMode')==='1') document.documentElement.setAttribute('data-theme','dark');

  function App(){
    const [user,setUser]         = useState(null);
    const [loading,setLoading]   = useState(true);
    const [vue,setVue]           = useState('catalogue');
    const [vueData,setVueData]   = useState(null);
    const [nbNotifs,setNbNotifs] = useState(0);
    const [nbItems,setNbItems]   = useState(0);
    useEffect(()=>{ api('me.php').then(d=>setUser(d.user)).catch(()=>setUser(null)).finally(()=>setLoading(false)); },[]);
    useEffect(()=>{
      if(!user)return;
      api('notifications.php').then(d=>setNbNotifs(d.nb_non_lues)).catch(()=>{});
      api('mon_sejour.php').then(d=>{
        setNbItems((d.hebergements?.length||0)+(d.transports?.length||0)+(d.activites?.length||0));
      }).catch(()=>{});
    },[user,vue]);
    async function login(email,mot_de_passe){
      const d=await api('login.php',{method:'POST',body:JSON.stringify({email,mot_de_passe})});
      setUser(d.user);
    }
    async function logout(){
      await api('logout.php',{method:'POST'});
      setUser(null); setVue('catalogue'); setVueData(null);
    }
    function nav(v,data=null){ setVue(v); setVueData(data); }

    if(loading)return <div className="screen-center muted">Chargement…</div>;
    if(!user)  return <Login onLogin={login}/>;

    const common={user,onLogout:logout,nav,nbNotifs,nbItems};
    if(vue==='confirmation'&&vueData) return <Confirmation infos={vueData} nav={nav}/>;
    if(vue==='panier')                return <Panier {...common}/>;
    if(vue==='notifications')         return <Notifications {...common}/>;
    if(vue==='profil')                return <Profil {...common}/>;
    if(vue==='historique')            return <Historique {...common}/>;
    if(vue==='hote')                  return <HoteDashboard {...common}/>;
    if(vue==='admin')                 return <AdminDashboard {...common}/>;
    if(vue==='destination'&&vueData)  return <DestinationDetail {...common} destination={vueData}/>;
    return <Catalogue {...common}/>;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
